# Optional local PostgreSQL. Skip this if you already have a PostgreSQL instance.
services:
  db:
    image: postgres:17-alpine
    container_name: event-rsvp-db
    environment:
      POSTGRES_USER: event_rsvp
      POSTGRES_PASSWORD: event_rsvp_dev
      POSTGRES_DB: event_rsvp
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - event-rsvp-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_rsvp -d event_rsvp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  event-rsvp-pgdata:
